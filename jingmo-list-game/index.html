return `<div class="logo"><i></i> RED FLAG DISTRICT / CLASSIFIED 07</div><h1>静默<span>名单</span></h1><div class="subtitle">THE SILENT REGISTER · FIRST-PERSON SURVIVAL</div><p class="lede">夜间 23:47。红旗街道以全民参保考核为由实施临时管制。路灯熄灭，广播仍在运行；一份不断扩充的强制参保名单决定居民的去留。搜查与逃亡发生在同一街区，所有决定均可能产生不可逆的后果。</p><div class="selection"><button type="button" class="role ${mode==='fugitive'?'active':''}" data-role="fugitive"><div class="n">01 / SURVIVE</div><h3>被追捕者</h3><p>进入强制参保名单的普通居民。隐蔽穿越居民楼，取得三份核查文书，利用黑暗误导巡逻人员，从东侧封锁线逃生。被发现后可能遭到致命攻击。</p></button><button type="button" class="role ${mode==='inspector'?'active':''}" data-role="inspector"><div class="n">02 / HUNT</div><h3>追捕者</h3><p>执行全民参保考核指令，辨认并拘捕至少三名未参保居民，押送至临时办理站。反抗者可能攻击行动队，武力使用会形成死亡记录。</p></button></div><div class="controls"><span>WASD 移动</span><span>鼠标转向</span><span>SHIFT 冲刺</span><span>E 交互 / 长按拘捕</span><span>C 蹲伏</span><span>F 手电</span><span>Q 特殊行动</span><span>左键 防身</span></div><button class="begin" id="start">进入管制区 →</button> <button class="outline" id="mute">声音：启用</button><div class="footer">单人离线网页原型 · 第一人称 2.5D 光线投射 · 动态巡逻、视线侦测、声音反应、两种身份、死亡结局<br>建议电脑端全屏体验并启用声音；移动端提供触屏摇杆与交互按钮。按 ESC 可暂停。</div>`}
let mute=false;
function showMenu(result){$('layer').style.display='flex';$('dialog').innerHTML=shellHTML(result);if(result){$('again').addEventListener('click',()=>start());$('choose').addEventListener('click',()=>{running=false;ending=false;showMenu()})}else{document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.role;document.querySelectorAll('[data-role]').forEach(r=>r.classList.toggle('active',r.dataset.role===mode))}));$('start').addEventListener('click',start);$('mute').addEventListener('click',e=>{mute=!mute;e.target.textContent='声音：'+(mute?'禁用':'启用');if(master)master.gain.value=mute?0:.12})}}
function start(){if(!audio)makeSound();if(audio?.state==='suspended')audio.resume().catch(()=>{});if(master)master.gain.value=mute?0:.12;worldBuild();spawn();running=true;paused=false;ending=false;elapsed=0;clock=270;alertLevel=0;damageFlash=0;shake=0;actionProgress=0;actionTarget=null;caught=0;files=0;killed=0;heard=-10;nextRadio=12;powerCutUntil=0;escapeUnlocked=false;steps=0;player.eLatch=false;controls.e=false;Object.keys(controls).forEach(k=>controls[k]=false);$('hud').style.display='block';$('layer').style.display='none';$('pauseButton').textContent='Ⅱ 暂停';updateHud();notify(mode==='fugitive'?'夜间封锁已开始':'专项行动已开始',mode==='fugitive'?'携带三份档案穿过东侧检查站':'拘捕至少三名未参保居民并押送办理站',5.3);lastFrame=performance.now();if(!isTouch)view.requestPointerLock?.().catch?.(()=>{})}
function endGame(win,title,text){if(ending)return;ending=true;running=false;paused=false;winning=win;if(document.pointerLockElement)document.exitPointerLock?.();$('hud').style.display='none';showMenu({title,text})}
function togglePause(){if(!running||ending)return;paused=!paused;$('pauseButton').textContent=paused?'▶ 继续':'Ⅱ 暂停';if(paused){$('lower').textContent='II 行动已暂停 · 点击继续按钮或按 ESC'}else{lastFrame=performance.now();if(!isTouch)view.requestPointerLock?.().catch?.(()=>{})}}
function keySet(key,value){switch(key){case 'KeyW':case 'ArrowUp':controls.w=value;break;case 'KeyA':case 'ArrowLeft':controls.a=value;break;case 'KeyS':case 'ArrowDown':controls.s=value;break;case 'KeyD':case 'ArrowRight':controls.d=value;break;case 'ShiftLeft':case 'ShiftRight':controls.shift=value;break;case 'KeyE':controls.e=value;break;case 'KeyQ':if(value)specialAction();break;case 'KeyC':controls.c=value;break;case 'KeyF':if(value&&running&&!paused){player.flash=!player.flash;sound('interact',.5)}break;case 'KeyM':if(value){miniShown=!miniShown;document.querySelector('.minimap').style.display=miniShown?'block':'none'}break;case 'Space':if(value)melee();break;case 'Escape':if(value)togglePause();break;case 'KeyP':if(value)togglePause();break;}}
window.addEventListener('keydown',e=>{let arr=['KeyW','KeyA','KeyS','KeyD','KeyE','KeyF','KeyQ','KeyC','KeyM','ShiftLeft','ShiftRight','Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Escape','KeyP'];if(arr.includes(e.code)){e.preventDefault();if(e.repeat&&['KeyQ','KeyF','KeyM','Space','Escape','KeyP'].includes(e.code))return;keySet(e.code,true)}});
window.addEventListener('keyup',e=>{keySet(e.code,false)});window.addEventListener('blur',()=>{for(let k of Object.keys(controls))controls[k]=false;if(running&&!paused)togglePause()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===view&&running&&!paused){player.a+=e.movementX*.0024;player.pitch=clamp(player.pitch+e.movementY*.004,-1,1)}});view.addEventListener('click',()=>{if(running&&!paused){if(document.pointerLockElement!==view&&!isTouch)view.requestPointerLock?.().catch?.(()=>{});else melee()}});document.addEventListener('pointerlockchange',()=>{if(running&&!paused&&!document.pointerLockElement&&!isTouch){/* release remains safe during HUD use */}});$('pauseButton').addEventListener('click',togglePause);$('pauseButton').style.pointerEvents='auto';
// Touch: independent virtual joystick, free-look region, and dedicated hold-to-detain button.
let lookID=null,lookX=0,lookY=0;
$('touchLook').addEventListener('pointerdown',e=>{lookID=e.pointerId;lookX=e.clientX;lookY=e.clientY;e.currentTarget.setPointerCapture(e.pointerId)});$('touchLook').addEventListener('pointermove',e=>{if(lookID!==e.pointerId||!running||paused)return;let dx=e.clientX-lookX,dy=e.clientY-lookY;player.a+=dx*.004;player.pitch=clamp(player.pitch+dy*.005,-1,1);lookX=e.clientX;lookY=e.clientY});for(let ev of ['pointerup','pointercancel'])$('touchLook').addEventListener(ev,()=>lookID=null);
let padID=null;function movePad(e){if(padID!==e.pointerId)return;let r=$('pad').getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),a=Math.atan2(y,x),dist=Math.min(48,Math.hypot(x,y));mobileVec={x:Math.cos(a)*dist/48,y:Math.sin(a)*dist/48};$('stick').style.transform=`translate(${mobileVec.x*42}px,${mobileVec.y*42}px)`}
$('pad').addEventListener('pointerdown',e=>{padID=e.pointerId;e.currentTarget.setPointerCapture(e.pointerId);movePad(e)});$('pad').addEventListener('pointermove',movePad);for(let ev of ['pointerup','pointercancel'])$('pad').addEventListener(ev,()=>{padID=null;mobileVec={x:0,y:0};$('stick').style.transform='' });
$('mobileE').addEventListener('pointerdown',e=>{e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);controls.e=true});for(let ev of ['pointerup','pointercancel'])$('mobileE').addEventListener(ev,()=>controls.e=false);$('mobileHit').addEventListener('pointerdown',e=>{e.preventDefault();melee()});$('mobileRun').addEventListener('pointerdown',e=>{e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);touchRun=true});for(let ev of ['pointerup','pointercancel'])$('mobileRun').addEventListener(ev,()=>touchRun=false);$('mobileQ').addEventListener('pointerdown',e=>{e.preventDefault();specialAction()});$('mobileFlash').addEventListener('pointerdown',e=>{e.preventDefault();if(running&&!paused){player.flash=!player.flash;sound('interact',.45)}});$('mobileCrouch').addEventListener('pointerdown',e=>{e.preventDefault();controls.c=!controls.c;e.currentTarget.style.background=controls.c?'#b39a7188':'#0e1c22b3'});
let tick=0;function frame(time){let delta=clamp((time-lastFrame)/1000,0,.05);lastFrame=time;if(running&&!paused&&!ending){update(delta);drawScene();tick++;if(tick%5===0)updateHud()}else if(!running&&!ending){if(time%2000<20)drawScene()}requestAnimationFrame(frame)}
worldBuild();spawn();showMenu();lastFrame=performance.now();requestAnimationFrame(frame);
})();
